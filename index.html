<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153d39">
  <title>Elsewhere | Find your next escape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #182b2a;
      --muted: #586967;
      --forest: #153d39;
      --forest-light: #e8f0ec;
      --accent: #c74832;
      --accent-hover: #a63725;
      --paper: #faf9f6;
      --white: #fff;
      --line: #dddeda;
      --sand: #f0ebe1;
      --radius: 20px;
      --shadow: 0 16px 50px #18352f12;
      --heading: "Plus Jakarta Sans", sans-serif;
      --body: "DM Sans", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    /* clip (not hidden) — prevents sideways scroll without breaking position:sticky */
    html, body { overflow-x: clip; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.6 var(--body); }
    body:has(dialog[open]) { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea, summary { -webkit-tap-highlight-color: transparent; }
    button, select, summary { cursor: pointer; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; object-fit: cover; }
    button:focus-visible, a:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid #087da3; outline-offset: 4px;
    }
    h1, h2, h3, h4 { font-family: var(--heading); line-height: 1.15; letter-spacing: -.045em; }
    h1 { font-size: clamp(2.5rem, 5.5vw, 5.3rem); margin: 16px 0 24px; font-weight: 700; }
    h2 { font-size: clamp(1.9rem, 3vw, 2.8rem); margin: 10px 0 20px; font-weight: 700; }
    h3 { font-size: 1.2rem; margin: 0 0 10px; letter-spacing: -.025em; }
    p { margin: 0 0 20px; }
    small, .small { font-size: .82rem; }
    .muted { color: var(--muted); }
    .container { width: min(1220px, calc(100% - 48px)); margin-inline: auto; }
    .section { padding-block: 66px; }
    .eyebrow { font-size: .72rem; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; color: var(--accent); }
    .row { display: flex; align-items: center; gap: 14px; }
    .between { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .grid { display: grid; gap: 24px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .stack > * + * { margin-top: 18px; }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      min-height: 46px; padding: 11px 20px; border: 1px solid transparent;
      border-radius: 10px; background: var(--forest); color: white; font-weight: 700;
      font-size: .88rem; transition: background .2s, transform .2s;
    }
    .btn:hover { background: #24554e; transform: translateY(-1px); }
    .btn.accent { background: var(--accent); }
    .btn.accent:hover { background: var(--accent-hover); }
    .btn.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.secondary:hover { background: var(--sand); }
    .btn.danger { background: #a32d2d; }
    .btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .text-link { color: var(--forest); font-weight: 700; text-decoration: underline; text-underline-offset: 5px; }
    .icon { width: 20px; height: 20px; flex: 0 0 auto; vertical-align: middle; }
    .icon-btn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: white; display: grid; place-items: center; }
    .icon-btn:hover { background: var(--sand); }
    .badge { display: inline-flex; align-items: center; gap: 5px; background: var(--forest-light); color: var(--forest); border-radius: 30px; padding: 5px 10px; font-size: .72rem; font-weight: 700; }
    .badge.sand { background: var(--sand); }
    .badge.red { background: #fbe8e5; color: #a32d2d; }
    .field { display: grid; gap: 7px; font-size: .83rem; font-weight: 700; }
    input:not([type=checkbox]):not([type=range]), select, textarea {
      width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 9px;
      padding: 12px 13px; background: white; color: var(--ink); min-height: 46px;
    }
    textarea { resize: vertical; min-height: 105px; }
    input[type=checkbox], input[type=range] { accent-color: var(--forest); }
    input[type=checkbox] { width: 17px; height: 17px; }
    .check { display: flex; align-items: center; gap: 9px; font-size: .87rem; padding-block: 5px; }
    fieldset { padding: 0; border: 0; margin: 0 0 22px; }
    legend { font-weight: 700; margin-bottom: 10px; }
    hr { border: 0; border-top: 1px solid var(--line); margin-block: 24px; }
    .skip { position: fixed; top: -100px; left: 15px; z-index: 100; background: white; padding: 12px; }
    .skip:focus { top: 10px; }
    header { background: #faf9f6f5; border-bottom: 1px solid #dddeda80; position: sticky; top: 0; z-index: 20; backdrop-filter: blur(16px); }
    .header-inner { min-height: 84px; }
    .brand { font: 800 1.5rem var(--heading); letter-spacing: -.075em; display: inline-flex; gap: 8px; align-items: center; }
    .brand-mark { width: 33px; height: 33px; background: var(--forest); color: white; display: grid; place-items: center; border-radius: 50% 50% 50% 7px; transform: rotate(-12deg); }
    .brand-mark svg { transform: rotate(12deg); }
    nav { display: flex; gap: 28px; }
    nav a { font-size: .83rem; font-weight: 600; position: relative; padding-block: 28px; }
    nav a[aria-current=page] { color: var(--accent); }
    nav a[aria-current=page]::after { content: ""; position: absolute; bottom: 18px; left: 0; right: 0; height: 2px; background: var(--accent); }
    .avatar { width: 29px; height: 29px; border-radius: 50%; display: grid; place-items: center; background: var(--sand); color: var(--forest); font-size: .72rem; }
    main { min-height: 65vh; }
    .page-enter { animation: reveal .45s both; }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .hero { position: relative; padding-top: 34px; }
    .hero-shell { display: grid; grid-template-columns: 1fr 1.03fr; min-height: 540px; border-radius: 26px; overflow: hidden; background: var(--sand); }
    .hero-copy { padding: 58px 44px 96px; position: relative; overflow: hidden; }
    .hero-copy::after { content: ""; width: 320px; height: 320px; border: 1px solid #153d3912; border-radius: 50%; position: absolute; left: -200px; bottom: -110px; box-shadow: 0 0 0 35px #153d3904, 0 0 0 70px #153d3903; pointer-events: none; }
    .hero h1 em { color: var(--forest); font-style: normal; position: relative; }
    .hero-copy p { max-width: 360px; color: var(--muted); }
    .hero-image { position: relative; }
    .hero-image > img { width: 100%; height: 100%; position: absolute; }
    .hero-image::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, #122b2870); }
    .photo-caption { position: absolute; bottom: 94px; left: 30px; z-index: 1; color: white; }
    .photo-caption strong { display: block; font-size: 1.1rem; }
    .travel-proof { font-size: .79rem; display: flex; align-items: center; gap: 11px; margin-top: 30px; }
    .proof-dots { display: flex; padding-left: 8px; }
    .proof-dots span { display: grid; place-items: center; background: #d1ddd4; border: 2px solid var(--sand); width: 32px; height: 32px; border-radius: 50%; margin-left: -8px; font-size: 11px; color: var(--forest); }
    .search-bar { position: relative; z-index: 3; display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr auto; align-items: end; gap: 12px; padding: 23px; background: white; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
    .hero .search-bar { margin: -52px 30px 0; }
    .search-bar .field { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
    .search-bar input, .search-bar select { font-size: .88rem; text-transform: none; letter-spacing: normal; }
    .guest-field { position: relative; }
    .guest-field > summary { list-style: none; border: 1px solid var(--line); padding: 12px; border-radius: 9px; font-size: .88rem; white-space: nowrap; min-height: 46px; }
    .guest-label { display: block; margin-bottom: 7px; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .guest-popover { position: absolute; top: calc(100% + 10px); right: 0; width: 270px; background: white; border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); z-index: 10; }
    .guest-popover .field { grid-template-columns: 1fr 80px; align-items: center; margin-bottom: 12px; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .section-heading h2, .section-heading p { margin-bottom: 0; }
    .destination-image { aspect-ratio: 4/5; position: relative; overflow: hidden; border-radius: 16px; background: var(--sand); }
    .destination-image img { height: 100%; width: 100%; transition: transform .6s; }
    .destination-card:hover img { transform: scale(1.045); }
    .destination-image::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, #0d2529c9); }
    .destination-overlay { position: absolute; bottom: 21px; left: 22px; right: 22px; color: white; z-index: 1; }
    .destination-overlay h3 { font-size: 1.5rem; margin-bottom: 4px; }
    .weather { position: absolute; top: 15px; right: 15px; background: #ffffffed; border-radius: 30px; padding: 5px 10px; font-size: .72rem; z-index: 2; }
    .destination-meta { padding: 15px 2px 0; }
    .destination-meta p { font-size: .88rem; margin: 0 0 10px; }
    .collection { min-height: 130px; padding: 23px; border: 1px solid var(--line); border-radius: 15px; background: white; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; transition: border-color .2s, background .2s; }
    .collection:hover { background: var(--forest-light); border-color: var(--forest); }
    .collection .icon { width: 27px; height: 27px; color: var(--forest); }
    .collection strong { font-size: .95rem; }
    .collection small { color: var(--muted); }
    .stay-card { overflow: hidden; border: 1px solid var(--line); border-radius: 17px; background: white; }
    .stay-photo { position: relative; height: 215px; background: var(--sand); }
    .stay-photo > img { width: 100%; height: 100%; }
    .heart { position: absolute; top: 14px; right: 14px; }
    .heart[aria-pressed=true] { color: var(--accent); }
    .heart[aria-pressed=true] svg { fill: currentColor; }
    .stay-photo > .badge { position: absolute; top: 15px; left: 15px; background: white; }
    .gallery-next { position: absolute; right: 14px; bottom: 14px; }
    .stay-body { padding: 21px; }
    .rating { color: var(--forest); font-size: .8rem; font-weight: 800; white-space: nowrap; }
    .amenities { display: flex; flex-wrap: wrap; gap: 7px; margin-block: 15px; }
    .amenities span { color: var(--muted); background: var(--paper); border-radius: 5px; padding: 4px 7px; font-size: .71rem; }
    .price { font-size: 1.45rem; font-weight: 800; letter-spacing: -.04em; }
    .price small { font-weight: 400; letter-spacing: 0; font-size: .8rem; }
    .green-banner { background: var(--forest); color: white; border-radius: 24px; padding: 42px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; background-image: radial-gradient(ellipse at 0 100%, #3c7161 0, transparent 65%); }
    .green-banner p { color: #d0dfd7; }
    .benefit { display: flex; gap: 14px; }
    .benefit .icon { width: 28px; height: 28px; color: #b6d8c9; }
    .benefit h3 { font-size: .97rem; letter-spacing: -.01em; }
    .benefit p { font-size: .8rem; margin: 0; }
    .page-title { max-width: 740px; margin-bottom: 35px; }
    .page-title h1 { font-size: clamp(2.6rem, 5vw, 4rem); }
    .tabs { display: flex; gap: 9px; overflow-x: auto; padding: 5px 4px 14px; margin: 24px -4px; }
    .tab { white-space: nowrap; padding: 10px 17px; border: 1px solid var(--line); background: white; border-radius: 30px; font-size: .85rem; font-weight: 600; }
    .tab[aria-pressed=true], .tab[aria-selected=true] { background: var(--forest); color: white; border-color: var(--forest); }
    .catalog .destination-image { aspect-ratio: 1.4; }
    details.accordion { border-bottom: 1px solid var(--line); padding: 18px 0; }
    details.accordion > summary { font-weight: 700; padding-right: 10px; }
    details.accordion p { margin: 14px 0 3px; color: var(--muted); font-size: .92rem; }
    .hotel-layout { display: grid; grid-template-columns: 250px 1fr; align-items: start; gap: 28px; margin-top: 34px; }
    .filters { position: sticky; top: 106px; max-height: calc(100vh - 126px); overflow: auto; padding: 22px; }
    .filters h3 { font-size: 1.1rem; }
    .filters legend { font-size: .86rem; }
    .range-label { display: flex; justify-content: space-between; font-size: .8rem; }
    .filters input[type=range] { width: 100%; }
    .results-top { margin-bottom: 20px; }
    .results-top select { width: auto; max-width: 210px; font-size: .83rem; }
    .hotel-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .mobile-filters { display: none; }
    .empty { grid-column: 1/-1; text-align: center; padding: 55px 20px; border: 1px dashed var(--line); border-radius: 18px; }
    .trip-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; align-items: start; }
    .trip-cover { width: 100%; height: 230px; border-radius: 14px; margin-bottom: 25px; }
    .timeline { margin: 25px 0 0 9px; padding-left: 24px; border-left: 2px solid var(--line); }
    .day { position: relative; padding-bottom: 25px; }
    .day::before { content: ""; position: absolute; left: -31px; top: 7px; width: 12px; height: 12px; background: var(--forest); border: 3px solid var(--paper); border-radius: 50%; }
    .day > summary { font-weight: 700; padding-bottom: 12px; }
    .activity { border-left: 2px solid #c8d8d0; padding: 5px 12px; margin: 12px 0; }
    .activity p { margin: 3px 0; font-size: .88rem; }
    .activity small { color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-size: .66rem; }
    .map-card { position: relative; overflow: hidden; min-height: 165px; display: grid; place-items: center; text-align: center; padding: 25px; border: 1px solid var(--line); border-radius: 13px; background-color: #e9eee6; background-image: linear-gradient(32deg, transparent 42%, #fff 43%, #fff 48%, transparent 49%), linear-gradient(110deg, transparent 42%, #d5e0db 43%, #d5e0db 57%, transparent 58%), repeating-linear-gradient(0deg, transparent 0 35px, #ffffff88 35px 39px); }
    .map-card > div { background: #ffffffee; border-radius: 10px; padding: 14px; }
    .map-card p { margin: 5px 0; font-size: .8rem; }
    .summary-line { display: flex; justify-content: space-between; gap: 20px; margin: 10px 0; font-size: .9rem; }
    .summary-line.total { border-top: 1px solid var(--line); padding-top: 15px; margin-top: 16px; font-weight: 800; font-size: 1.15rem; }
    .contact-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 45px; align-items: center; margin-bottom: 55px; }
    .contact-hero img { width: 100%; height: 370px; border-radius: 22px; }
    .team-person { display: flex; align-items: center; gap: 12px; }
    .team-person .avatar { width: 45px; height: 45px; background: var(--forest-light); }
    footer { background: #eeeee7; margin-top: 45px; padding: 55px 0 22px; border-top: 1px solid var(--line); }
    .footer-grid { display: grid; grid-template-columns: 1.5fr .8fr .8fr 1.4fr; gap: 35px; }
    .footer-grid h3 { font-size: .86rem; letter-spacing: 0; margin-bottom: 17px; }
    .footer-grid a:not(.brand) { display: block; font-size: .84rem; color: var(--muted); margin-bottom: 9px; }
    .footer-grid p { font-size: .85rem; color: var(--muted); }
    .footer-bottom { border-top: 1px solid #d4d8cf; padding-top: 23px; margin-top: 35px; }
    .footer-bottom select { width: auto; background: transparent; padding: 6px 10px; font-size: .8rem; }
    dialog { border: 1px solid var(--line); border-radius: 20px; padding: 0; width: min(580px, calc(100% - 28px)); max-height: calc(100dvh - 40px); background: var(--paper); color: var(--ink); box-shadow: 0 30px 100px #0003; }
    dialog::backdrop { background: #0b242b99; backdrop-filter: blur(5px); }
    dialog.drawer { width: min(560px, 100%); max-height: 100dvh; height: 100dvh; margin: 0 0 0 auto; border-radius: 20px 0 0 20px; }
    .dialog-header { display: flex; align-items: center; justify-content: space-between; padding: 23px 25px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 3; }
    .dialog-header h2 { font-size: 1.4rem; margin: 0; }
    .dialog-body { padding: 25px; }
    .dialog-body .field { margin-bottom: 15px; }
    .dialog-body > img { width: 100%; height: 220px; border-radius: 12px; margin-bottom: 20px; }
    .notice { background: var(--forest-light); border-radius: 10px; padding: 14px; color: var(--forest); font-size: .83rem; margin-block: 18px; }
    .error { color: #a32d2d; font-size: .85rem; margin-top: 10px; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--forest); color: white; padding: 13px 22px; border-radius: 12px; box-shadow: var(--shadow); z-index: 100; max-width: calc(100% - 32px); font-size: .9rem; }
    #toast:empty { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    @media (min-width: 1450px) { .hero-shell { min-height: 590px; } }
    @media (max-width: 1050px) {
      nav { gap: 15px; }
      .hero-copy { padding: 45px 30px 90px; }
      .search-bar { grid-template-columns: 1.2fr 1fr 1fr; }
      .search-bar .btn { min-height: 48px; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hotel-layout { grid-template-columns: 220px 1fr; gap: 20px; }
      .hotel-results { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 760px) {
      .container { width: calc(100% - 32px); }
      .header-inner { flex-wrap: wrap; gap: 0; padding-top: 14px; }
      .brand { font-size: 1.35rem; }
      header .account { margin-left: auto; }
      nav { order: 3; width: 100%; overflow-x: auto; gap: 23px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      nav::-webkit-scrollbar { display: none; }
      nav a { white-space: nowrap; display: inline-flex; align-items: center; min-height: 44px; padding-block: 14px; scroll-snap-align: center; font-size: .77rem; }
      nav a[aria-current=page]::after { bottom: 8px; }
      .hero { padding-top: 18px; }
      .hero-shell { grid-template-columns: 1fr; }
      .hero-copy { padding: 32px 27px; }
      .hero-copy h1 { font-size: clamp(2.2rem, 11vw, 3.3rem); }
      .hero-copy p { margin-bottom: 0; }
      .travel-proof { margin-top: 19px; }
      .hero-image { height: 270px; }
      .photo-caption { bottom: 65px; left: 23px; }
      .hero .search-bar { margin: -36px 12px 0; }
      .search-bar { grid-template-columns: 1fr 1fr; padding: 17px; gap: 13px; }
      .search-bar > .field:first-child, .search-bar > .btn { grid-column: 1/-1; }
      .search-bar .guest-field { grid-column: 1/-1; }
      .guest-popover { left: 0; right: auto; width: 100%; }
      .section { padding-block: 40px; }
      .section-heading { align-items: start; flex-direction: column; gap: 14px; }
      .grid-3, .grid-2, .trip-layout, .contact-hero, .green-banner { grid-template-columns: 1fr; }
      .grid-4 { gap: 14px; }
      .destination-overlay { left: 14px; bottom: 14px; right: 10px; }
      .destination-overlay h3 { font-size: 1.15rem; }
      .destination-overlay small { font-size: .7rem; }
      .weather { top: 10px; right: 10px; font-size: .65rem; padding: 3px 7px; }
      .destination-meta { font-size: .8rem; }
      .collection { padding: 18px; }
      .green-banner { padding: 28px; gap: 26px; }
      .green-banner .grid-2 { grid-template-columns: 1fr 1fr; gap: 24px; }
      .hotel-layout { grid-template-columns: 1fr; margin-top: 24px; }
      .filters { position: static; max-height: none; display: none; }
      .filters.is-open { display: block; }
      .mobile-filters { display: inline-flex; }
      .results-top { gap: 12px; flex-wrap: wrap; }
      .contact-hero { gap: 20px; }
      .contact-hero img { height: 260px; }
      .footer-grid { gap: 30px 24px; }
      .footer-grid > :first-child, .footer-grid > :last-child { grid-column: 1/-1; }
      .footer-bottom { align-items: start; flex-direction: column; }
      .panel { padding: 21px; }
      dialog.drawer { border-radius: 0; }
    }
    @media (max-width: 480px) {
      .container { width: calc(100% - 24px); }
      .hero-copy { padding: 26px 20px; }
      .search-bar { padding: 15px; gap: 11px; }
      .section { padding-block: 32px; }
      .green-banner { padding: 22px; border-radius: 18px; }
      .contact-hero img { height: 210px; }
      .trip-cover { height: 170px; }
      .grid-4, .grid-3, .grid-2 { gap: 12px; }
      .btn { width: 100%; }
      #toast { bottom: 16px; font-size: .85rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    @media print {
      header, footer, .no-print, #toast, dialog, .trip-tabs { display: none !important; }
      body { background: white; color: black; }
      .container { width: 100%; }
      .section { padding: 0; }
      .trip-layout { display: block; }
      .panel { margin-bottom: 20px; break-inside: avoid; }
      .trip-cover { height: 150px; }
      .day { break-inside: avoid; }
      .page-enter { animation: none; }
    }

              ["clock", "Flexible plans", "Clear cancellation windows before you reserve."],
              ["support", "A human touch", "A support hub for questions along the way."],
              ["leaf", "Lighter footprints", "Our mission: more mindful, accessible travel."]
            ].map(([i, title, text]) => `<div class="benefit">${icon(i)}<div><h3>${title}</h3><p>${text}</p></div></div>`).join("")}

    function filteredDestinations() {
      const query = destinationQuery.toLowerCase().trim();
      return destinations.filter(d => (destinationCategory === "All" || d.category === destinationCategory) &&
        `${d.name} ${d.country} ${d.category}`.toLowerCase().includes(query));
    }
    function destinationResults() {
      const list = filteredDestinations();
      return list.length ? list.map(d => destinationCard(d, true)).join("") :
        `<div class="empty"><h3>No destinations found</h3><p class="muted">Try a different city, country, or category.</p></div>`;
    }
    function destinationsPage() {
      return `<div class="container section page-enter">
        <div class="page-title"><span class="eyebrow">The world is calling</span><h1>Find a place<br>that feels like you.</h1><p class="muted">From familiar favorites to beautiful detours. Start with a little curiosity.</p></div>
        <label class="field" style="max-width:580px">Find a destination<input id="destination-finder" type="search" placeholder="Search cities, countries, or regions" value="${e(destinationQuery)}"></label>
        <div class="tabs" aria-label="Destination categories">${categories.map(c => `<button class="tab" data-action="category" data-value="${e(c)}" aria-pressed="${c === destinationCategory}">${e(c)}</button>`).join("")}</div>
        <p id="destination-count" class="small muted" role="status">${filteredDestinations().length} destinations</p>
        <div id="destination-grid" class="grid grid-3 catalog">${destinationResults()}</div>
        <section class="section"><span class="eyebrow">A local point of view</span><h2>A little know-how goes a long way.</h2>
          <div class="grid grid-3">${[
            ["48 hours in Lisbon", "Day one: wander Alfama, pause for a pastry, and take in a hilltop sunset. Day two: explore Belem and leave time for a slow neighborhood dinner. Check attraction hours before visiting."],
            ["Kyoto, with consideration", "Keep voices low in residential lanes, ask before photographing people, and follow posted temple etiquette. Build your day around a garden, a market, and an unhurried tea break."],
            ["Monteverde, naturally", "Pack a rain layer and reusable bottle. Stay on marked trails, keep your distance from wildlife, and consider a local naturalist guide. Confirm trail conditions with your accommodation."]
          ].map(([title, body]) => `<div class="panel"><span class="badge sand">The Elsewhere notebook</span><details class="accordion"><summary>${title}</summary><p>${body}</p></details></div>`).join("")}</div>
        </section>
      </div>`;
    }

    function filterFields() {
      return `<div class="row between"><h3>Make it your stay</h3><button class="btn secondary" data-action="clear-filters" style="padding:7px 10px">Reset</button></div><hr>
        <fieldset><legend>Nightly price per room</legend><div class="range-label"><span id="min-price">${money(filters.min)}</span><span id="max-price">${money(filters.max)}</span></div>
          <label class="small muted" for="price-min">Minimum price</label><input id="price-min" type="range" min="0" max="400" step="5" value="${filters.min}" data-filter="min">
          <label class="small muted" for="price-max">Maximum price</label><input id="price-max" type="range" min="0" max="400" step="5" value="${filters.max}" data-filter="max">
        </fieldset>
        <fieldset><legend>Property type</legend>${["Hotel", "Resort", "Villa", "Apartment"].map(t => `<label class="check"><input type="checkbox" data-filter="types" value="${t}" ${filters.types.includes(t) ? "checked" : ""}>${t}</label>`).join("")}</fieldset>
        <fieldset><legend>Property stars</legend><label class="sr-only" for="star-filter">Minimum property stars</label><select id="star-filter" data-filter="stars">${[[0, "Any star rating"], [3, "3 stars and up"], [4, "4 stars and up"], [5, "5 stars"]].map(([value, label]) => `<option value="${value}" ${filters.stars === value ? "selected" : ""}>${label}</option>`).join("")}</select></fieldset>
        <fieldset><legend>Guest review score</legend><label class="sr-only" for="rating-filter">Minimum guest rating</label><select id="rating-filter" data-filter="rating">${[[0, "Any review score"], [3, "3.0 and up"], [4, "4.0 and up"], [4.5, "4.5 and up"], [4.8, "4.8 and up"]].map(([value, label]) => `<option value="${value}" ${filters.rating === value ? "selected" : ""}>${label}</option>`).join("")}</select></fieldset>
        <fieldset><legend>Amenities</legend>${amenities.map(a => `<label class="check"><input type="checkbox" data-filter="amenities" value="${e(a)}" ${filters.amenities.includes(a) ? "checked" : ""}>${e(a)}</label>`).join("")}</fieldset>
        <fieldset><legend>Collection</legend><label class="sr-only" for="collection-filter">Stay collection</label><select id="collection-filter" data-filter="collection"><option value="">All collections</option>${["Beachfront", "Cabin & Nature", "City Center", "Boutique"].map(c => `<option ${filters.collection === c ? "selected" : ""}>${e(c)}</option>`).join("")}</select></fieldset>
        <label class="check"><input type="checkbox" data-filter="saved" ${filters.saved ? "checked" : ""}>Only my saved stays</label>`;
    }
    function filteredStays() {
      const query = state.search.destination.toLowerCase().trim();
      const list = stays.filter(stay => {
        const d = destinationFor(stay);
        return `${d.name} ${d.country} ${stay.name}`.toLowerCase().includes(query) &&
          stay.price >= filters.min && stay.price <= filters.max &&
          (!filters.types.length || filters.types.includes(stay.type)) &&
          filters.amenities.every(a => stay.amenities.includes(a)) &&
          stay.stars >= filters.stars && stay.rating >= filters.rating &&
          (!filters.collection || stay.collection === filters.collection) &&
          (!filters.saved || state.favorites.includes(stay.id));
      });
      return list.sort((a, b) => filters.sort === "price" ? a.price - b.price :
        filters.sort === "rating" ? b.rating - a.rating || b.reviews - a.reviews :
        (b.rating * 100 + b.reviews / 10) - (a.rating * 100 + a.reviews / 10));
    }
    function hotelResults() {
      const list = filteredStays();
      return list.length ? list.map(s => stayCard(s, true)).join("") :
        `<div class="empty">${icon("search")}<h3 style="margin-top:15px">A little too specific?</h3><p class="muted">No stays match these choices. Try a wider search.</p><button class="btn" data-action="reset-search">Show all stays</button></div>`;
    }
    function hotelsPage() {
      return `<div class="container section page-enter">
        <div class="page-title"><span class="eyebrow">Stay somewhere special</span><h1>Your next favorite place.</h1><p class="muted">Clear prices. Flexible plans. Settle directly with your property when you arrive.</p></div>
        ${searchForm()}
        <div class="hotel-layout">
          <button class="btn secondary mobile-filters" data-action="toggle-filters" aria-expanded="false" aria-controls="hotel-filters">${icon("filter")} Filters</button>
          <aside id="hotel-filters" class="panel filters" aria-label="Filter stays">${filterFields()}</aside>
          <section aria-label="Stay results">
            <div class="row between results-top"><div><strong id="result-count" role="status">${filteredStays().length} stays found</strong><div class="small muted">Curated places. A world of possibilities.</div></div>
              <label class="row small">Sort by <select data-filter="sort">${[["recommended", "Recommended"], ["price", "Price: low to high"], ["rating", "Guest rating"]].map(([v, t]) => `<option value="${v}" ${filters.sort === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
            </div>
            <div class="hotel-results" id="hotel-results">${hotelResults()}</div>
            <p class="small muted" style="margin-top:22px">All properties, availability, ratings, and prices are demonstration data. Images are illustrative. Maximum stay: 30 nights.</p>
          </section>

    function updateHotelResults() {
      $("#hotel-results").innerHTML = hotelResults();
      $("#result-count").textContent = `${filteredStays().length} stays found`;
      $("#min-price").textContent = money(filters.min);
      $("#max-price").textContent = money(filters.max);
    }

    function tripStatus(trip) {
      if (trip.status === "cancelled") return "Cancelled";
      if (trip.search.checkout <= today()) return "Past";
      if (trip.search.checkin <= today()) return "In progress";
      return "Upcoming";
    }
    function costSummary(costs, search) {
      return `<div class="summary-line"><span>${money(costs.rate)} &times; ${nights(search)} nights &times; ${search.rooms} room${search.rooms > 1 ? "s" : ""}</span><span>${money(costs.lodging)}</span></div>
        <div class="summary-line"><span>Cleaning fee</span><span>${money(costs.cleaning)}</span></div>
        <div class="summary-line"><span>Estimated taxes (12%)</span><span>${money(costs.tax)}</span></div>
        <div class="summary-line total"><span>Estimated total</span><span>${money(costs.total)}</span></div>`;
    }
    function tripsPage() {
      const trip = state.trips.find(t => t.id === selectedTrip) || state.trips[0];
      if (!trip) return `<div class="container section"><div class="empty"><h1>Your next chapter starts here.</h1><p class="muted">Your reservations will appear here. Find a stay to make your first plan.</p><a class="btn" href="#/hotels">Explore stays</a></div></div>`;
      selectedTrip = trip.id;
      const stay = stays.find(s => s.id === trip.stayId);
      const d = destinationFor(stay);
      const status = tripStatus(trip);
      const editable = status === "Upcoming";
      const days = nights(trip.search);
      return `<div class="container section page-enter">
        <div class="section-heading"><div><span class="eyebrow">Less planning. More being there.</span><h1 style="font-size:clamp(2rem,9vw,3.4rem);margin-bottom:10px">Your travel notebook.</h1><p class="muted">All the details, with room for a little spontaneity.</p></div><button class="btn secondary no-print" data-action="print">Print / save PDF</button></div>
        <div class="tabs trip-tabs" aria-label="Your reservations">${state.trips.map(t => `<button class="tab" data-action="select-trip" data-id="${e(t.id)}" aria-pressed="${t.id === trip.id}">${e(destinationFor(stays.find(s => s.id === t.stayId)).name)} &middot; ${e(tripStatus(t))} &middot; ${e(t.id)}</button>`).join("")}</div>
        <div class="trip-layout">
          <div>
            <article class="panel"><img class="trip-cover" src="${photo(d.image)}" srcset="${photoSet(d.image)}" sizes="(max-width: 760px) calc(100vw - 32px), 720px" alt="${e(d.name)} destination view" loading="lazy" decoding="async">
              <div class="row between wrap"><span class="eyebrow">${e(trip.id)}</span><span class="badge ${status === "Cancelled" ? "red" : ""}">${status}</span></div>
              <h2 style="margin-top:18px">${e(d.name)} is on the horizon.</h2>
              <h3>${e(stay.name)}</h3>
              <p class="muted">${dateLabel(trip.search.checkin)} &rarr; ${dateLabel(trip.search.checkout)}<br>${trip.search.adults} adults, ${trip.search.children} children &middot; ${trip.search.rooms} room${trip.search.rooms > 1 ? "s" : ""} &middot; ${e(trip.room)}</p>
              <span class="badge ${status === "Cancelled" ? "red" : ""}">${status === "Cancelled" ? "Reservation cancelled" : "Confirmed (Pay at Check-In)"}</span>
            </article>
            <section style="margin-top:35px"><div class="row between wrap"><h2 style="font-size:1.9rem;margin:0">A plan, not a schedule.</h2>${status !== "Cancelled" ? `<button class="btn secondary no-print" data-action="add-note" data-id="${e(trip.id)}">+ Add activity</button>` : ""}</div>
              <div class="timeline">${Array.from({ length: days }, (_, index) => {
                const date = addDays(trip.search.checkin, index);
                return `<details class="day" open><summary>Day ${index + 1} &middot; ${dateLabel(date)}</summary>
                  ${["Morning", "Afternoon", "Evening"].map(slot => {
                    const notes = trip.notes.filter(n => Number(n.day) === index && n.slot === slot);
                    const fallback = index === 0 && slot === "Afternoon" ? `Check in at ${stay.name} after 3:00 PM.` :
                      slot === "Morning" ? "Start slow. Find your neighborhood coffee spot." :
                      slot === "Afternoon" ? "Leave a little room to explore." : "A local dinner, then see where the evening goes.";
                    return `<div class="activity"><small>${slot}</small>
                      ${notes.length ? notes.map(n => `<div class="row between"><p>${e(n.text)}</p><button class="icon-btn no-print" data-action="delete-note" data-id="${e(n.id)}" aria-label="Delete activity">${icon("close")}</button></div>`).join("") : `<p class="muted">${e(fallback)}</p>`}
                    </div>`;
                  }).join("")}
                </details>`;
              }).join("")}</div>
              <p class="small muted">Checkout: ${dateLabel(trip.search.checkout)}, by 11:00 AM. Suggested activities are placeholders, not reservations.</p>
            </section>
          </div>
          <aside class="stack">
            <section class="panel"><h3>Your stay, at a glance</h3>${costSummary(trip.costs, trip.search)}
              <div class="notice">${icon("shield")} ${status === "Cancelled" ? "This reservation is no longer active." : "Nothing charged now. Settle directly with the property upon arrival."}</div>
              <p class="small muted">Guest: ${e(trip.guest.name)}<br>${e(trip.guest.email)}<br>${e(trip.guest.phone)}</p>
              ${trip.guest.requests ? `<p class="small"><strong>Special requests:</strong> ${e(trip.guest.requests)}</p>` : ""}
              <div class="stack no-print">${editable ? `<button class="btn secondary" style="width:100%" data-action="modify" data-id="${e(trip.id)}">Modify reservation</button><button class="btn secondary" style="width:100%;color:#a32d2d" data-action="cancel" data-id="${e(trip.id)}">Cancel booking</button>` : ""}
                <button class="btn" style="width:100%" data-action="host" data-id="${e(trip.id)}">Contact front desk ${icon("mail")}</button>
              </div>
            </section>
            <section class="panel"><h3>Your little corner of the world</h3><div class="map-card"><div>${icon("pin")}<p>${e(stay.address)}</p><a class="text-link small" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stay.address)}">Open location in Maps</a></div></div><small class="muted">Illustrative map. Property addresses are demo data.</small></section>
            <div class="notice"><strong>A note on cancellations</strong><br>Free until 48 hours before the 3:00 PM property-local check-in time. Later cancellations may incur the first night's room charge. This demo records no real reservation or charge.</div>
          </aside>
        </div>
      </div>`;
    }

    function contactPage() {
      return `<div class="container section page-enter">
        <section class="contact-hero"><div><span class="eyebrow">A world worth getting to know</span><h1>Travel closer.<br>Even when you<br>go far.</h1><p class="muted">Elsewhere began with a simple idea: the best trips aren't about ticking boxes. They're about feeling connected to a place, its people, and yourself.</p><p class="muted">Our mission is to make thoughtful travel easier, with clear information, independent stays, and a growing focus on accessibility and lighter environmental footprints.</p><span class="badge sand">Fictional company &middot; working product demo</span></div><img src="${photo("photo-1476514525535-07fb3b4ae5f1")}" srcset="${photoSet("photo-1476514525535-07fb3b4ae5f1")}" sizes="(max-width: 760px) calc(100vw - 32px), 580px" alt="Quiet lakeside village surrounded by mountains" loading="lazy" decoding="async"></section>
        <section style="margin-bottom:55px"><span class="eyebrow">People behind the places</span><h2>Curiosity is a team sport.</h2><div class="grid grid-3">${[["Maya Chen", "Co-founder & travel experience", "MC"], ["Jonas Reed", "Co-founder & local partnerships", "JR"], ["Amara Okafor", "Accessibility & community", "AO"]].map(([name, role, initials]) => `<div class="panel team-person"><span class="avatar">${initials}</span><div><strong>${name}</strong><div class="small muted">${role}</div></div></div>`).join("")}</div></section>
        <div class="grid grid-2">
          <section class="panel"><span class="eyebrow">We're all ears</span><h2>Let's talk travel.</h2>
            <form id="contact-form">
              <div class="grid grid-2"><label class="field">Name<input name="name" autocomplete="name" value="${e(state.user?.name || "")}" required maxlength="100"></label><label class="field">Email address<input name="email" type="email" autocomplete="email" value="${e(state.user?.email || "")}" required maxlength="180"></label></div>
              <label class="field" style="margin-top:18px">What can we help with?<select name="subject"><option>Booking Support</option><option>General Inquiry</option><option>Partnership</option></select></label>
              <label class="field" style="margin-top:18px">Your message<textarea name="message" required minlength="10" maxlength="3000" placeholder="Tell us what's on your mind."></textarea></label>
              <p class="small muted" style="margin-top:15px">Demo form: your message is validated locally and is not sent to a support team.</p><button class="btn accent">Submit demo inquiry ${icon("arrow")}</button>
            </form>
          </section>
          <section><div class="panel"><h3>A little help, right here.</h3>
            ${[
              ["Can I change my booking?", "Open My Trips and select Modify reservation for an upcoming booking. Updated dates and guest counts recalculate your estimate before you save. This demo assumes room availability."],
              ["What is the cancellation policy?", "Our sample properties allow free cancellation until 48 hours before check-in. After that, a first-night charge may apply. Review the property's terms before making real travel plans."],
              ["When do I pay?", "No prepayment is collected here. The intended model is direct settlement at the property on arrival. Demo reservations do not reserve real accommodation."],
              ["How does check-in work?", "Sample check-in is from 3:00 PM and checkout is by 11:00 AM. Confirm arrival arrangements and accessibility needs directly with a real property before traveling."]
            ].map(([q, a]) => `<details class="accordion"><summary>${q}</summary><p>${a}</p></details>`).join("")}
          </div>
          <div class="panel" style="margin-top:22px"><h3>Prefer a direct hello?</h3><p class="small muted">Sample support channels, not monitored:<br>hello@elsewhere.example<br>+1 (202) 555-0142<br>Monday - Friday, 9:00 AM - 6:00 PM ET</p><div class="map-card"><div>${icon("pin")}<strong>Elsewhere Studio</strong><p>100 Example Avenue, Washington, DC<br>Illustrative office address</p></div></div></div></section>
        </div>
      </div>`;
    }

    function render() {
      renderHeader();
      renderFooter();
      const pages = { "/": homePage, "/destinations": destinationsPage, "/hotels": hotelsPage, "/trips": tripsPage, "/contact": contactPage };
      const current = route();
      $("#main-content").innerHTML = (pages[current] || (() => `<div class="container section empty"><h1>A little off the map.</h1><p>This page doesn't exist.</p><a class="btn" href="#/">Back to home</a></div>`))();
      const titles = { "/": "Find your next escape", "/destinations": "Explore destinations", "/hotels": "Hotels & stays", "/trips": "My trips", "/contact": "About & contact" };
      document.title = `${titles[current] || "Page not found"} | Elsewhere`;
    }

    const modal = $("#modal");
    function openDialog(title, body, drawer = false) {
      if (!modal.open) lastDialogTrigger = document.activeElement;
      modal.className = drawer ? "drawer" : "";
      modal.innerHTML = `<div class="dialog-header"><h2 id="dialog-title">${e(title)}</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon("close")}</button></div><div class="dialog-body">${body}</div>`;
      if (!modal.open) modal.showModal();
      modal.scrollTop = 0;
      requestAnimationFrame(() => {
        const target = $("input:not([type=hidden]), select, textarea", modal) || $("button", modal);
        target?.focus();
      });
    }
    function closeDialog() { modal.close(); }
    modal.addEventListener("close", () => { lastDialogTrigger?.isConnected && lastDialogTrigger.focus(); });
    modal.addEventListener("click", event => {
      if (event.target !== modal) return;
      const box = modal.getBoundingClientRect();
      if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closeDialog();
    });

    function authDialog(signup = false) {
      openDialog("Your next chapter starts here", `<div class="tabs" aria-label="Account action"><button class="tab" data-action="auth" aria-pressed="${!signup}">Sign in</button><button class="tab" data-action="signup" aria-pressed="${signup}">Sign up</button></div>
        <div class="notice">Demo authentication only. Credentials are not verified. Passwords are never saved. Do not use a real password.</div>
        <form id="auth-form" data-signup="${signup}">
          ${signup ? `<label class="field">Full name<input name="name" autocomplete="name" required maxlength="100"></label>` : ""}
          <label class="field">Email address<input name="email" type="email" autocomplete="email" required maxlength="180"></label>
          <label class="field">Demo password<input name="password" type="password" autocomplete="${signup ? "new-password" : "current-password"}" required minlength="8"></label>
          <button class="btn accent" style="width:100%">${signup ? "Create demo profile" : "Enter demo account"}</button>
        </form><p class="small muted" style="margin-top:16px">This browser has one shared demo workspace. Switching profiles does not isolate bookings or favorites.</p>`);
    }
    function profileDialog() {
      if (!state.user) return authDialog();
      openDialog("Your little travel corner", `<form id="profile-form">
        <label class="field">Name<input name="name" value="${e(state.user.name)}" required maxlength="100"></label>
        <label class="field">Email<input name="email" type="email" value="${e(state.user.email)}" required maxlength="180"></label>
        <label class="check"><input name="notifications" type="checkbox" ${state.user.notifications ? "checked" : ""}>Travel inspiration and booking updates</label>
        <p class="small muted">Preference saved locally. No notifications are sent.</p><button class="btn">Save profile</button>
      </form><hr><div class="stack">
        <button class="btn secondary" style="width:100%" data-action="wishlist">${icon("heart")} Saved stays (${state.favorites.length})</button>
        <button class="btn secondary" style="width:100%" data-action="go-trips">My trips (${state.trips.length})</button>
        <button class="btn secondary" style="width:100%" data-action="signout">Sign out of demo profile</button>
      </div>`);
    }
    function searchError(s) {
      if (!Number.isFinite(dateNumber(s.checkin)) || !Number.isFinite(dateNumber(s.checkout))) return "Choose valid check-in and check-out dates.";
      if (s.checkin < today()) return "Check-in cannot be in the past.";
      if (nights(s) < 1) return "Check-out must be after check-in.";
      if (nights(s) > 30) return "This demo supports stays of up to 30 nights.";
      if (![s.adults, s.children, s.rooms].every(Number.isInteger) || s.adults < 1 || s.adults > 12 || s.children < 0 || s.children > 10 || s.rooms < 1 || s.rooms > 6) return "Check your guest and room counts.";
      if (s.adults < s.rooms) return "Each room needs at least one adult.";
      if (s.adults + s.children > s.rooms * 4) return "Please add rooms. Each demo room accommodates up to 4 guests.";
      return "";
    }
    function readSearch(form) {
      const data = new FormData(form);
      return {
        destination: String(data.get("destination") ?? state.search.destination).trim(),
        checkin: String(data.get("checkin")), checkout: String(data.get("checkout")),
        adults: Number(data.get("adults")), children: Number(data.get("children")), rooms: Number(data.get("rooms"))
      };
    }

    function bookDialog(id, preserve = false) {
      const stay = stays.find(s => s.id === id);
      const error = searchError(state.search);
      if (error && !preserve) { toast(error); navigate("/hotels"); return; }
      if (!preserve) bookingDraft = { stayId: id, search: { ...state.search }, room: "Standard", guest: { name: state.user?.name || "", email: state.user?.email || "", phone: "", requests: "" } };
      const b = bookingDraft;
      openDialog("Make yourself at home", `<img src="${photo(stay.image, 900)}" alt="${e(stay.name)} accommodation preview">
        <span class="eyebrow">${e(destinationFor(stay).name)} &middot; ${stay.stars}-star ${stay.type}</span><h2 style="font-size:1.8rem">${e(stay.name)}</h2>
        <p class="small muted">${dateLabel(b.search.checkin)} - ${dateLabel(b.search.checkout)}<br>${b.search.adults + b.search.children} guests &middot; ${b.search.rooms} room${b.search.rooms > 1 ? "s" : ""}</p>
        <form id="booking-form">
          <label class="field">Choose your room<select name="room" id="room-select">${Object.keys(roomRates).map(r => `<option value="${r}" ${b.room === r ? "selected" : ""}>${r} &middot; ${money(stay.price + roomRates[r])} / room / night</option>`).join("")}</select></label>
          <div id="booking-costs">${costSummary(calculate(stay, b.search, b.room), b.search)}</div><hr>
          <h3>Who's checking in?</h3>
          <label class="field">Full name<input name="name" value="${e(b.guest.name)}" autocomplete="name" required maxlength="100"></label>
          <label class="field">Email address<input name="email" type="email" value="${e(b.guest.email)}" autocomplete="email" required maxlength="180"></label>
          <label class="field">Phone number<input name="phone" type="tel" value="${e(b.guest.phone)}" autocomplete="tel" required minlength="7" maxlength="30"></label>
          <label class="field">Special requests <span class="muted">(optional)</span><textarea name="requests" maxlength="1000" placeholder="Arrival time, accessibility needs, or anything else we should know.">${e(b.guest.requests)}</textarea></label>
          <div class="notice">${icon("shield")} No prepayment. No card details. Pay directly at the property.</div>
          <button class="btn accent" style="width:100%">Review reservation ${icon("arrow")}</button>
        </form>`, true);
    }

    function reviewBooking() {
      const b = bookingDraft;
      const stay = stays.find(s => s.id === b.stayId);
      b.costs = calculate(stay, b.search, b.room);
      openDialog("One last look", `<span class="eyebrow">Step 2 of 2 &middot; Review your stay</span><h2 style="font-size:1.9rem">${e(stay.name)}</h2>
        <div class="panel"><strong>${e(b.room)} &middot; ${b.search.rooms} room${b.search.rooms > 1 ? "s" : ""}</strong><p class="small muted" style="margin:10px 0 0">${dateLabel(b.search.checkin)} - ${dateLabel(b.search.checkout)}<br>${b.search.adults} adults &middot; ${b.search.children} children<br>${e(b.guest.name)}<br>${e(b.guest.email)}<br>${e(b.guest.phone)}</p>${b.guest.requests ? `<p class="small" style="margin:12px 0 0">${e(b.guest.requests)}</p>` : ""}</div>
        ${costSummary(b.costs, b.search)}
        <div class="notice"><strong>Pay upon arrival</strong><br>Settle directly with the property at check-in. No payment is collected by Elsewhere.</div>
        <p class="small muted">Free cancellation until 48 hours before the 3:00 PM property-local check-in time. After that, a first-night room charge may apply. Checkout is at 11:00 AM. Special requests are not guaranteed.</p>
        <form id="confirm-booking-form"><label class="check"><input type="checkbox" required>I have reviewed the dates, guest details, and cancellation policy.</label><p class="small muted">This creates a local demo reservation only, not a real property booking.</p><button class="btn accent" style="width:100%">Confirm reservation</button></form>
        <button class="btn secondary" style="width:100%;margin-top:12px" data-action="booking-back">Back to guest details</button>`, true);
    }

    function modifyDialog(trip) {
      const s = trip.search;
      openDialog("A change of plans", `<p class="muted">Update your upcoming stay. Availability is assumed for this demo.</p><form id="modify-form" data-id="${e(trip.id)}">
        <div class="grid grid-2"><label class="field">Check-in<input name="checkin" type="date" min="${today()}" value="${s.checkin}" required></label><label class="field">Check-out<input name="checkout" type="date" min="${addDays(s.checkin, 1)}" value="${s.checkout}" required></label></div>
        <div class="grid grid-3"><label class="field">Adults<input name="adults" type="number" min="1" max="12" value="${s.adults}" required></label><label class="field">Children<input name="children" type="number" min="0" max="10" value="${s.children}" required></label><label class="field">Rooms<input name="rooms" type="number" min="1" max="6" value="${s.rooms}" required></label></div>
        <div id="modify-costs">${costSummary(trip.costs, s)}</div><p class="small muted">Activities remain attached to their day number. Activities beyond a shortened stay are removed.</p><p class="error" id="modify-error" role="alert"></p>
        <button class="btn accent" style="width:100%">Confirm changes</button></form>`);
    }

    function addNoteDialog(trip) {
      openDialog("Make room for a memory", `<form id="note-form" data-id="${e(trip.id)}"><label class="field">Day<select name="day">${Array.from({ length: nights(trip.search) }, (_, i) => `<option value="${i}">Day ${i + 1} &middot; ${dateLabel(addDays(trip.search.checkin, i))}</option>`).join("")}</select></label><label class="field">Time of day<select name="slot"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label><label class="field">Activity or note<textarea name="text" required maxlength="500" placeholder="Museum tour at 2:00 PM, then coffee around the corner."></textarea></label><button class="btn accent">Add to itinerary</button></form>`);
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      event.preventDefault();
      const { action, id, value } = button.dataset;
      const trip = state.trips.find(t => t.id === (id || selectedTrip));
      switch (action) {
        case "close": closeDialog(); break;
        case "auth": authDialog(); break;
        case "signup": authDialog(true); break;
        case "profile": profileDialog(); break;
        case "signout": state.user = null; persist(); closeDialog(); renderHeader(); toast("Signed out. Shared demo trips remain on this browser."); break;
        case "go-trips": closeDialog(); navigate("/trips"); break;
        case "wishlist": closeDialog(); filters = { ...freshFilters(), saved: true }; state.search.destination = ""; persist(); navigate("/hotels"); break;
        case "favorite": {
          const saved = state.favorites.includes(id);
          state.favorites = saved ? state.favorites.filter(x => x !== id) : [...state.favorites, id];
          persist();
          if (route() === "/hotels" && filters.saved) updateHotelResults();
          else {
            button.setAttribute("aria-pressed", String(!saved));
            const stay = stays.find(s => s.id === id);
            button.setAttribute("aria-label", `${saved ? "Save" : "Remove"} ${stay.name} ${saved ? "to" : "from"} favorites`);
          }
          toast(saved ? "Removed from saved stays." : "A good find. Stay saved.");
          break;
        }
        case "destination": state.search.destination = destinations.find(d => d.id === id).name; filters = freshFilters(); persist(); navigate("/hotels"); break;
        case "collection": filters = { ...freshFilters(), collection: value }; state.search.destination = ""; persist(); navigate("/hotels"); break;
        case "category":
          destinationCategory = value;
          $$('[data-action="category"]').forEach(el => el.setAttribute("aria-pressed", String(el.dataset.value === value)));
          $("#destination-grid").innerHTML = destinationResults();
          $("#destination-count").textContent = `${filteredDestinations().length} destinations`;
          break;
        case "clear-filters": filters = freshFilters(); $("#hotel-filters").innerHTML = filterFields(); updateHotelResults(); break;
        case "reset-search": filters = freshFilters(); state.search.destination = ""; persist(); render(); break;
        case "toggle-filters": {
          const open = $("#hotel-filters").classList.toggle("is-open");
          button.setAttribute("aria-expanded", String(open));
          break;
        }
        case "gallery": {
          const stay = stays.find(s => s.id === id);
          const image = $(`#image-${id}`);
          const alternate = image.dataset.alternate !== "true";
          image.dataset.alternate = String(alternate);
          image.src = photo(alternate ? destinationFor(stay).image : stay.image, 800);
          image.alt = alternate ? `${destinationFor(stay).name} destination preview` : `${stay.name} accommodation preview`;
          break;
        }
        case "book": bookDialog(id); break;
        case "booking-back": bookDialog(bookingDraft.stayId, true); break;
        case "select-trip": selectedTrip = id; render(); break;
        case "modify": if (tripStatus(trip) === "Upcoming") modifyDialog(trip); break;
        case "cancel":
          openDialog("Cancel this reservation?", `<p>Your stay at <strong>${e(stays.find(s => s.id === trip.stayId).name)}</strong> will be marked as cancelled. This cannot be undone.</p><div class="notice">In a real booking, cancellation within 48 hours of check-in may incur the first night's room charge. This demo does not collect or refund money.</div><div class="row wrap"><button class="btn secondary" data-action="close">Keep my trip</button><button class="btn danger" data-action="confirm-cancel" data-id="${e(trip.id)}">Cancel reservation</button></div>`);
          break;
        case "confirm-cancel":
          if (tripStatus(trip) !== "Upcoming") break;
          trip.status = "cancelled"; persist(); closeDialog(); render(); toast("Reservation cancelled. No real payment was collected."); break;
        case "add-note": addNoteDialog(trip); break;
        case "delete-note": {
          const current = state.trips.find(t => t.id === selectedTrip);
          current.notes = current.notes.filter(n => n.id !== id); persist(); render(); toast("Activity removed."); break;
        }
        case "print":
          $$(".day").forEach(day => day.open = true);
          window.print(); break;
        case "host":
          openDialog("Contact your front desk", `<p class="muted">About reservation ${e(trip.id)}</p><form id="host-form"><label class="field">Your message<textarea name="message" required minlength="10" maxlength="2000" placeholder="Ask about arrival, accessibility, or your stay."></textarea></label><div class="notice">Demo inquiry only. This message is not delivered to a property.</div><button class="btn accent">Submit demo inquiry</button></form>`); break;
        case "social":
          openDialog("Find us elsewhere", `<p class="muted">Sample social handles for this fictional brand:</p><div class="panel">Instagram &middot; @elsewhere.travel.demo<br>Pinterest &middot; @elsewhere.travel.demo</div><p class="small muted" style="margin-top:15px">No live social accounts are connected.</p>`); break;
      }
    });

    function handleFilter(element) {
      const key = element.dataset.filter;
      if (!key) return;
      if (["types", "amenities"].includes(key)) {
        filters[key] = element.checked ? [...new Set([...filters[key], element.value])] : filters[key].filter(v => v !== element.value);
      } else if (key === "saved") filters.saved = element.checked;
      else if (["min", "max", "stars", "rating"].includes(key)) {
        filters[key] = Number(element.value);
        if (filters.min > filters.max) {
          if (key === "min") filters.max = filters.min;
          else filters.min = filters.max;
          $("#price-min").value = filters.min;
          $("#price-max").value = filters.max;
        }
      } else filters[key] = element.value;
      updateHotelResults();
    }

    document.addEventListener("input", event => {
      const element = event.target;
      if (element.id === "destination-finder") {
        destinationQuery = element.value;
        $("#destination-grid").innerHTML = destinationResults();
        $("#destination-count").textContent = `${filteredDestinations().length} destinations`;
      }
      if (element.matches('input[type="range"][data-filter]')) handleFilter(element);

      const form = element.closest("form");
      if (form?.id === "stay-search") {
        const a = Number(form.elements.adults.value) || 0;
        const c = Number(form.elements.children.value) || 0;
        const r = Number(form.elements.rooms.value) || 0;
        $("#guest-summary").textContent = `${a + c} guests, ${r} room${r !== 1 ? "s" : ""}`;
      }
      if (form && ["stay-search", "modify-form"].includes(form.id) && element.name === "checkin" && element.value) {
        form.elements.checkout.min = addDays(element.value, 1);
        if (form.elements.checkout.value <= element.value) form.elements.checkout.value = addDays(element.value, 1);
      }
      if (form?.id === "modify-form") {
        const trip = state.trips.find(t => t.id === form.dataset.id);
        const s = { ...readSearch(form), destination: trip.search.destination };
        const error = searchError(s);
        $("#modify-error").textContent = error;
        if (!error) $("#modify-costs").innerHTML = costSummary(calculate(stays.find(stay => stay.id === trip.stayId), s, trip.room), s);
      }
    });

    document.addEventListener("change", event => {
      const element = event.target;
      if (element.dataset.filter && element.type !== "range") handleFilter(element);
      if (element.id === "currency") {
        state.currency = element.value; persist(); render();
        toast("Display currency updated using illustrative, fixed exchange rates.");
      }
      if (element.id === "room-select") {
        bookingDraft.room = element.value;
        $("#booking-costs").innerHTML = costSummary(calculate(stays.find(s => s.id === bookingDraft.stayId), bookingDraft.search, bookingDraft.room), bookingDraft.search);
      }
    });

    document.addEventListener("submit", event => {
      const form = event.target;
      event.preventDefault();
      if (!form.reportValidity()) return;
      const data = Object.fromEntries(new FormData(form));
      switch (form.id) {
        case "stay-search": {
          const search = readSearch(form);
          const error = searchError(search);
          if (error) { toast(error); return; }
          state.search = search; persist(); navigate("/hotels"); break;
        }
        case "auth-form": {
          const name = (data.name || data.email.split("@")[0]).trim();
          if (!name) { toast("Enter a name containing more than spaces."); return; }
          state.user = { name, email: data.email.trim(), notifications: true };
          persist(); closeDialog(); renderHeader(); toast("Demo profile ready. No password was stored."); break;
        }
        case "profile-form":
          if (!data.name.trim()) { toast("Please enter your name."); return; }
          state.user = { name: data.name.trim(), email: data.email.trim(), notifications: data.notifications === "on" };
          persist(); closeDialog(); renderHeader(); toast("Profile preferences saved."); break;
        case "booking-form":
          if (!data.name.trim() || !/^[+()\d\s.-]{7,30}$/.test(data.phone) || data.phone.replace(/\D/g, "").length < 7) {
            toast("Enter a full name and a valid phone number with at least 7 digits."); return;
          }
          bookingDraft.room = data.room;
          bookingDraft.guest = { name: data.name.trim(), email: data.email.trim(), phone: data.phone.trim(), requests: data.requests.trim() };
          reviewBooking(); break;
        case "confirm-booking-form": {
          if (!bookingDraft) return;
          const error = searchError(bookingDraft.search);
          if (error) { toast(error); return; }
          const trip = { ...structuredClone(bookingDraft), id: "TRV-" + uid().replace(/-/g, "").slice(0, 8).toUpperCase(), status: "confirmed", notes: [] };
          state.trips.unshift(trip);
          selectedTrip = trip.id;
          persist();
          bookingDraft = null;
          closeDialog();
          navigate("/trips");
          openDialog("You're going elsewhere", `<div style="text-align:center"><span class="badge">${icon("check")} Demo reservation confirmed</span><h2 style="margin-top:22px">Your next chapter is booked.</h2><p class="muted">Reference <strong>${e(trip.id)}</strong><br>Your itinerary is ready in My Trips.</p><div class="notice"><strong>Nothing charged today.</strong><br>Pay upon arrival / direct property settlement.<br>This is a local demo, not a real hotel reservation.</div><button class="btn accent" data-action="close">Explore my itinerary ${icon("arrow")}</button></div>`);
          break;
        }
        case "modify-form": {
          const trip = state.trips.find(t => t.id === form.dataset.id);
          if (tripStatus(trip) !== "Upcoming") { toast("Only upcoming reservations can be modified."); return; }
          const search = { ...readSearch(form), destination: trip.search.destination };
          const error = searchError(search);
          if (error) { $("#modify-error").textContent = error; return; }
          trip.search = search;
          trip.costs = calculate(stays.find(s => s.id === trip.stayId), search, trip.room);
          trip.notes = trip.notes.filter(n => Number(n.day) < nights(search));
          persist(); closeDialog(); render(); toast("Reservation updated. Your new estimate is ready."); break;
        }
        case "note-form": {
          if (!data.text.trim()) { toast("Add an activity or note first."); return; }
          const trip = state.trips.find(t => t.id === form.dataset.id);
          trip.notes.push({ id: uid(), day: Number(data.day), slot: data.slot, text: data.text.trim() });
          persist(); closeDialog(); render(); toast("A little more to look forward to. Activity added."); break;
        }
        case "contact-form":
          if (!data.name.trim() || data.message.trim().length < 10) { toast("Enter your name and a message of at least 10 characters."); return; }
          form.reset();
          openDialog("Demo inquiry complete", `<div class="notice">${icon("check")} Your ${e(data.subject.toLowerCase())} inquiry passed client-side validation.</div><p class="muted">No message has been sent. Connect a server endpoint and email provider to enable real support submissions.</p><button class="btn" data-action="close">Close</button>`);
          break;
        case "host-form":
          if (data.message.trim().length < 10) { toast("Write a message of at least 10 characters."); return; }
          closeDialog(); toast("Demo inquiry validated. No message was sent to the property."); break;
        case "newsletter-form":
          form.reset(); toast("Demo signup validated. No subscription or email was created."); break;
      }
    });

    // The skip link focuses the main landmark without changing the app route.
    $(".skip").addEventListener("click", event => {
      event.preventDefault();
      $("#main-content").focus();
      $("#main-content").scrollIntoView();
    });

    window.addEventListener("hashchange", () => {
      if (modal.open) closeDialog();
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
      $("#main-content").focus({ preventScroll: true });
    });

    // Broken remote images receive a local, dependency-free placeholder.
    document.addEventListener("error", event => {
      if (!(event.target instanceof HTMLImageElement) || event.target.dataset.fallback) return;
      event.target.dataset.fallback = "true";
      event.target.src = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="#e3e9df"/><circle cx="760" cy="180" r="80" fill="#d6be91"/><path d="M0 620 330 230 560 470 740 310 1000 620v80H0Z" fill="#719386"/><path d="m0 650 290-230 300 280H0Z" fill="#315e51"/><text x="50" y="85" fill="#153d39" font-family="sans-serif" font-size="34">Somewhere worth discovering.</text></svg>'
      );
    }, true);

    persist();
    render();
  </script>
</body>
</html>
