  <style>
    :root {
      --ink: #182b2a;

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    /* clip (not hidden) — prevents sideways scroll without breaking position:sticky */
    html, body { overflow-x: clip; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 16px/1.6 var(--body); }

        <label class="check"><input type="checkbox" data-filter="saved" ${filters.saved ? "checked" : ""}>Only my saved stays</label>`;

    function filteredStays() {
      const query = state.search.destination.toLowerCase().trim();
      const list = stays.filter(stay => {
        const d = destinationFor(stay);
        return `${d.name} ${d.country} ${stay.name}`.toLowerCase().includes(query) &&
          stay.price >= filters.min && stay.price <= filters.max &&
          (!filters.types.length || filters.types.includes(stay.type)) &&
          filters.amenities.every(a => stay.amenities.includes(a)) &&
          stay.stars >= filters.stars && stay.rating >= filters.rating &&
          (!filters.collection || stay.collection === filters.collection) &&
          (!filters.saved || state.favorites.includes(stay.id));
      });
      return list.sort((a, b) => filters.sort === "price" ? a.price - b.price :
        filters.sort === "rating" ? b.rating - a.rating || b.reviews - a.reviews :
        (b.rating * 100 + b.reviews / 10) - (a.rating * 100 + a.reviews / 10));
    }
    function hotelResults() {
      const list = filteredStays();
      return list.length ? list.map(s => stayCard(s, true)).join("") :

    function tripStatus(trip) {
      if (trip.status === "cancelled") return "Cancelled";
      if (trip.search.checkout <= today()) return "Past";
      if (trip.search.checkin <= today()) return "In progress";
      return "Upcoming";
    }
    function costSummary(costs, search) {
      return `<div class="summary-line"><span>${money(costs.rate)} &times; ${nights(search)} nights &times; ${search.rooms} room${search.rooms > 1 ? "s" : ""}</span><span>${money(costs.lodging)}</span></div>
        <div class="summary-line"><span>Cleaning fee</span><span>${money(costs.cleaning)}</span></div>
        <div class="summary-line"><span>Estimated GST (5%)</span><span>${money(costs.tax)}</span></div>
        <div class="summary-line total"><span>Estimated total</span><span>${money(costs.total)}</span></div>`;
    }
    function tripsPage() {

      const stay = stays.find(s => s.id === trip.stayId);

      const status = tripStatus(trip);

      const days = nights(trip.search);
      return `<div class="container section page-enter">

        <div class="tabs trip-tabs" aria-label="Your reservations">${state.trips.map(t => `<button class="tab" data-action="select-trip" data-id="${e(t.id)}" aria-pressed="${t.id === trip.id}">${e(destinationFor(stays.find(s => s.id === t.stayId)).name)} &middot; ${e(tripStatus(t))} &middot; ${e(t.id)}</button>`).join("")}</div>
        <div class="trip-layout">
          <div>
            <article class="panel"><img class="trip-cover" src="${photo(d.image)}" srcset="${photoSet(d.image)}" sizes="(max-width: 760px) calc(100vw - 32px), 720px" alt="${e(d.name)} destination view" loading="lazy" decoding="async">
              <div class="row between wrap"><span class="eyebrow">${e(trip.id)}</span><span class="badge ${status === "Cancelled" ? "red" : ""}">${status}</span></div>
              <h2 style="margin-top:18px">${e(d.name)} is on the horizon.</h2>
              <h3>${e(stay.name)}</h3>
              <p class="muted">${dateLabel(trip.search.checkin)} &rarr; ${dateLabel(trip.search.checkout)}<br>${trip.search.adults} adults, ${trip.search.children} children &middot; ${trip.search.rooms} room${trip.search.rooms > 1 ? "s" : ""} &middot; ${e(trip.room)}</p>
              <span class="badge ${status === "Cancelled" ? "red" : ""}">${status === "Cancelled" ? "Reservation cancelled" : "Confirmed (Pay at Check-In)"}</span>
            </article>
            <section style="margin-top:35px"><div class="row between wrap"><h2 style="font-size:1.9rem;margin:0">A plan, not a schedule.</h2>${status !== "Cancelled" ? `<button class="btn secondary no-print" data-action="add-note" data-id="${e(trip.id)}">+ Add activity</button>` : ""}</div>
              <div class="timeline">${Array.from({ length: days }, (_, index) => {
                const date = addDays(trip.search.checkin, index);
                return `<details class="day" open><summary>Day ${index + 1} &middot; ${dateLabel(date)}</summary>
                  ${["Morning", "Afternoon", "Evening"].map(slot => {
                    const notes = trip.notes.filter(n => Number(n.day) === index && n.slot === slot);
                    const fallback = index === 0 && slot === "Afternoon" ? `Check in at ${stay.name} after 3:00 PM.` :
                      slot === "Morning" ? "Start slow. Find your neighborhood coffee spot." :
                      slot === "Afternoon" ? "Leave a little room to explore." : "A local dinner, then see where the evening goes.";
                    return `<div class="activity"><small>${slot}</small>
                      ${notes.length ? notes.map(n => `<div class="row between"><p>${e(n.text)}</p><button class="icon-btn no-print" data-action="delete-note" data-id="${e(n.id)}" aria-label="Delete activity">${icon("close")}</button></div>`).join("") : `<p class="muted">${e(fallback)}</p>`}
                    </div>`;
                  }).join("")}
                </details>`;

              <p class="small muted">Guest: ${e(trip.guest.name)}<br>${e(trip.guest.email)}<br>${e(trip.guest.phone)}</p>
              ${trip.guest.requests ? `<p class="small"><strong>Special requests:</strong> ${e(trip.guest.requests)}</p>` : ""}
              <div class="stack no-print">${editable ? `<button class="btn secondary" style="width:100%" data-action="modify" data-id="${e(trip.id)}">Modify reservation</button><button class="btn secondary" style="width:100%;color:#a32d2d" data-action="cancel" data-id="${e(trip.id)}">Cancel booking</button>` : ""}
                <button class="btn" style="width:100%" data-action="host" data-id="${e(trip.id)}">Contact front desk ${icon("mail")}</button>
              </div>
            </section>
            <section class="panel"><h3>Your little corner of the world</h3><div class="map-card"><div>${icon("pin")}<p>${e(stay.address)}</p><a class="text-link small" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stay.address)}">Open location in Maps</a></div></div><small class="muted">Illustrative map. Property addresses are demo data.</small></section>
            <div class="notice"><strong>A note on cancellations</strong><br>Free until 48 hours before the 3:00 PM property-local check-in time. Later cancellations may incur the first night's room charge. This demo records no real reservation or charge.</div>
          </aside>
        </div>
      </div>`;
    }

    function render() {
      menuOpen = false;
      renderHeader();
      renderFooter();
      const pages = { "/": homePage, "/packages": packagesPage, "/destinations": destinationsPage, "/hotels": hotelsPage, "/trips": tripsPage, "/contact": contactPage };
      const current = route();
      $("#main-content").innerHTML = (pages[current] || (() => `<div class="container section empty"><h1>A little off the map.</h1><p>This page doesn't exist.</p><a class="btn" href="#/">Back to home</a></div>`))();
      const titles = {
        "/": "Best travel agency in Kolkata | Custom holiday packages",
        "/packages": "Tour packages — India & international",
        "/destinations": "Explore destinations",
        "/hotels": "Hotels & stays",
        "/trips": "Your trips",
        "/contact": "About & contact"
      };
      document.title = `${titles[current] || "Page not found"} | Alive Dreams Holidays`;
    }

    const modal = $("#modal");
    function openDialog(title, body, drawer = false) {
      if (!modal.open) lastDialogTrigger = document.activeElement;
      modal.className = drawer ? "drawer" : "";
      modal.innerHTML = `<div class="dialog-header"><h2 id="dialog-title">${e(title)}</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">${icon("close")}</button></div><div class="dialog-body">${body}</div>`;
      if (!modal.open) modal.showModal();
      modal.scrollTop = 0;
      requestAnimationFrame(() => {
        const target = $("input:not([type=hidden]), select, textarea", modal) || $("button", modal);
        target?.focus();
      });
    }
    function closeDialog() { modal.close(); }
    function openWhatsApp(text) {
      window.open(waLink(text), "_blank", "noopener");
    }
    function callbackDialog() {
      const options = [
        "Not sure yet",
        ...new Set(packages.map(p => `${p.region} — ${p.title}`)),
        "Ladakh", "Meghalaya", "Rajasthan", "Kerala", "Goa", "Darjeeling",
        "Bali", "Maldives", "Domestic hotel stay"
      ];
      openDialog("Request a callback", `
        <p class="small muted">Leave your details and we'll call you back — usually within one working hour, Monday to Saturday, 10:00 AM - 7:00 PM IST.</p>
        <form id="callback-form">
          <label class="field">Your name<input name="name" autocomplete="name" required maxlength="80" placeholder="e.g. Riya Sen"></label>
          <label class="field">Phone number<input name="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="[0-9+ ]{10,16}" title="10 to 16 digits, may include + and spaces" placeholder="+91 98300 00000"></label>
          <label class="field">Destination or package<select name="destination">${options.map(o => `<option>${e(o)}</option>`).join("")}</select></label>
          <div class="grid grid-2">
            <label class="field">Travel date<input type="date" name="date" min="${today()}"></label>
            <label class="field">Travellers<input type="number" name="pax" min="1" max="60" value="2" required></label>
          </div>
          <div class="notice">${icon("shield")} We call back, we don't spam. Nothing you type here is stored on this site.</div>
          <button class="btn accent" style="width:100%">Request callback ${icon("arrow")}</button>
          <p class="small muted" style="margin:14px 0 0;text-align:center">Rather type than talk? <a class="text-link" href="${waLink(WA_DEFAULT)}" target="_blank" rel="noopener">Chat on WhatsApp</a></p>
        </form>`);
    }
    modal.addEventListener("close", () => { lastDialogTrigger?.isConnected && lastDialogTrigger.focus(); });
    modal.addEventListener("click", event => {
      if (event.target !== modal) return;
      const box = modal.getBoundingClientRect();
      if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) closeDialog();
    });

    function authDialog(signup = false) {
      openDialog("Your next chapter starts here", `<div class="tabs" aria-label="Account action"><button class="tab" data-action="auth" aria-pressed="${!signup}">Sign in</button><button class="tab" data-action="signup" aria-pressed="${signup}">Sign up</button></div>
        <div class="notice">Demo authentication only. Credentials are not verified. Passwords are never saved. Do not use a real password.</div>
        <form id="auth-form" data-signup="${signup}">
          ${signup ? `<label class="field">Full name<input name="name" autocomplete="name" required maxlength="100"></label>` : ""}
          <label class="field">Email address<input name="email" type="email" autocomplete="email" required maxlength="180"></label>
          <label class="field">Demo password<input name="password" type="password" autocomplete="${signup ? "new-password" : "current-password"}" required minlength="8"></label>
          <button class="btn accent" style="width:100%">${signup ? "Create demo profile" : "Enter demo account"}</button>
        </form><p class="small muted" style="margin-top:16px">This browser has one shared demo workspace. Switching profiles does not isolate bookings or favorites.</p>`);

    function profileDialog() {
      if (!state.user) return authDialog();
      openDialog("Your little travel corner", `<form id="profile-form">
        <label class="field">Name<input name="name" value="${e(state.user.name)}" required maxlength="100"></label>
        <label class="field">Email<input name="email" type="email" value="${e(state.user.email)}" required maxlength="180"></label>
        <label class="check"><input name="notifications" type="checkbox" ${state.user.notifications ? "checked" : ""}>Travel inspiration and booking updates</label>
        <p class="small muted">Preference saved locally. No notifications are sent.</p><button class="btn">Save profile</button>
      </form><hr><div class="stack">
        <button class="btn secondary" style="width:100%" data-action="wishlist">${icon("heart")} Saved stays (${state.favorites.length})</button>
        <button class="btn secondary" style="width:100%" data-action="go-trips">My trips (${state.trips.length})</button>
        <button class="btn secondary" style="width:100%" data-action="signout">Sign out of demo profile</button>
      </div>`);
    }
    function searchError(s) {
      if (!Number.isFinite(dateNumber(s.checkin)) || !Number.isFinite(dateNumber(s.checkout))) return "Choose valid check-in and check-out dates.";
      if (s.checkin < today()) return "Check-in cannot be in the past.";
      if (nights(s) < 1) return "Check-out must be after check-in.";
      if (nights(s) > 30) return "This demo supports stays of up to 30 nights.";
      if (![s.adults, s.children, s.rooms].every(Number.isInteger) || s.adults < 1 || s.adults > 12 || s.children < 0 || s.children > 10 || s.rooms < 1 || s.rooms > 6) return "Check your guest and room counts.";
      if (s.adults < s.rooms) return "Each room needs at least one adult.";
      if (s.adults + s.children > s.rooms * 4) return "Please add rooms. Each demo room accommodates up to 4 guests.";
      return "";
    }
    function readSearch(form) {
      const data = new FormData(form);
      return {
        destination: String(data.get("destination") ?? state.search.destination).trim(),
        checkin: String(data.get("checkin")), checkout: String(data.get("checkout")),
        adults: Number(data.get("adults")), children: Number(data.get("children")), rooms: Number(data.get("rooms"))
      };
    }

    function bookDialog(id, preserve = false) {
      const stay = stays.find(s => s.id === id);
      const error = searchError(state.search);
      if (error && !preserve) { toast(error); navigate("/hotels"); return; }
      if (!preserve) bookingDraft = { stayId: id, search: { ...state.search }, room: "Standard", guest: { name: state.user?.name || "", email: state.user?.email || "", phone: "", requests: "" } };
      const b = bookingDraft;
      openDialog("Make yourself at home", `<img src="${photo(stay.image, 900)}" alt="${e(stay.name)} accommodation preview">
        <span class="eyebrow">${e(destinationFor(stay).name)} &middot; ${stay.stars}-star ${stay.type}</span><h2 style="font-size:1.8rem">${e(stay.name)}</h2>
        <p class="small muted">${dateLabel(b.search.checkin)} - ${dateLabel(b.search.checkout)}<br>${b.search.adults + b.search.children} guests &middot; ${b.search.rooms} room${b.search.rooms > 1 ? "s" : ""}</p>
        <form id="booking-form">
          <label class="field">Choose your room<select name="room" id="room-select">${Object.keys(roomRates).map(r => `<option value="${r}" ${b.room === r ? "selected" : ""}>${r} &middot; ${money(stay.price + roomRates[r])} / room / night</option>`).join("")}</select></label>
          <div id="booking-costs">${costSummary(calculate(stay, b.search, b.room), b.search)}</div><hr>
          <h3>Who's checking in?</h3>
          <label class="field">Full name<input name="name" value="${e(b.guest.name)}" autocomplete="name" required maxlength="100"></label>
          <label class="field">Email address<input name="email" type="email" value="${e(b.guest.email)}" autocomplete="email" required maxlength="180"></label>
          <label class="field">Phone number<input name="phone" type="tel" value="${e(b.guest.phone)}" autocomplete="tel" required minlength="7" maxlength="30"></label>
          <label class="field">Special requests <span class="muted">(optional)</span><textarea name="requests" maxlength="1000" placeholder="Arrival time, accessibility needs, or anything else we should know.">${e(b.guest.requests)}</textarea></label>
          <div class="notice">${icon("shield")} No prepayment. No card details. Pay directly at the property.</div>
          <button class="btn accent" style="width:100%">Review reservation ${icon("arrow")}</button>
        </form>`, true);
    }

    function reviewBooking() {
      const b = bookingDraft;
      const stay = stays.find(s => s.id === b.stayId);
      b.costs = calculate(stay, b.search, b.room);
      openDialog("One last look", `<span class="eyebrow">Step 2 of 2 &middot; Review your stay</span><h2 style="font-size:1.9rem">${e(stay.name)}</h2>
        <div class="panel"><strong>${e(b.room)} &middot; ${b.search.rooms} room${b.search.rooms > 1 ? "s" : ""}</strong><p class="small muted" style="margin:10px 0 0">${dateLabel(b.search.checkin)} - ${dateLabel(b.search.checkout)}<br>${b.search.adults} adults &middot; ${b.search.children} children<br>${e(b.guest.name)}<br>${e(b.guest.email)}<br>${e(b.guest.phone)}</p>${b.guest.requests ? `<p class="small" style="margin:12px 0 0">${e(b.guest.requests)}</p>` : ""}</div>
        ${costSummary(b.costs, b.search)}
        <div class="notice"><strong>Pay upon arrival</strong><br>Settle directly with the property at check-in. Nothing is charged online by this site.</div>
        <p class="small muted">Free cancellation until 48 hours before the 3:00 PM property-local check-in time. After that, a first-night room charge may apply. Checkout is at 11:00 AM. Special requests are not guaranteed.</p>
        <form id="confirm-booking-form"><label class="check"><input type="checkbox" required>I have reviewed the dates, guest details, and cancellation policy.</label><p class="small muted">This creates a local demo reservation only, not a real property booking.</p><button class="btn accent" style="width:100%">Confirm reservation</button></form>
        <button class="btn secondary" style="width:100%;margin-top:12px" data-action="booking-back">Back to guest details</button>`, true);
    }

    function modifyDialog(trip) {
      const s = trip.search;
      openDialog("A change of plans", `<p class="muted">Update your upcoming stay. Availability is assumed for this demo.</p><form id="modify-form" data-id="${e(trip.id)}">
        <div class="grid grid-2"><label class="field">Check-in<input name="checkin" type="date" min="${today()}" value="${s.checkin}" required></label><label class="field">Check-out<input name="checkout" type="date" min="${addDays(s.checkin, 1)}" value="${s.checkout}" required></label></div>
        <div class="grid grid-3"><label class="field">Adults<input name="adults" type="number" min="1" max="12" value="${s.adults}" required></label><label class="field">Children<input name="children" type="number" min="0" max="10" value="${s.children}" required></label><label class="field">Rooms<input name="rooms" type="number" min="1" max="6" value="${s.rooms}" required></label></div>
        <div id="modify-costs">${costSummary(trip.costs, s)}</div><p class="small muted">Activities remain attached to their day number. Activities beyond a shortened stay are removed.</p><p class="error" id="modify-error" role="alert"></p>
        <button class="btn accent" style="width:100%">Confirm changes</button></form>`);
    }

    function addNoteDialog(trip) {
      openDialog("Make room for a memory", `<form id="note-form" data-id="${e(trip.id)}"><label class="field">Day<select name="day">${Array.from({ length: nights(trip.search) }, (_, i) => `<option value="${i}">Day ${i + 1} &middot; ${dateLabel(addDays(trip.search.checkin, i))}</option>`).join("")}</select></label><label class="field">Time of day<select name="slot"><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label><label class="field">Activity or note<textarea name="text" required maxlength="500" placeholder="Museum tour at 2:00 PM, then coffee around the corner."></textarea></label><button class="btn accent">Add to itinerary</button></form>`);
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      event.preventDefault();
      const { action, id, value } = button.dataset;
      const trip = state.trips.find(t => t.id === (id || selectedTrip));
      switch (action) {
        case "close": closeDialog(); break;
        case "menu": menuOpen = !menuOpen; renderHeader(); break;
        case "callback": callbackDialog(); break;
        case "pkg-tab":
          packageRegion = value;
          $$('[data-action="pkg-tab"]').forEach(el => el.setAttribute("aria-pressed", String(el.dataset.value === value)));
          $("#package-grid").innerHTML = packageResults();
          $("#package-count").textContent = `${filteredPackages().length} package${filteredPackages().length === 1 ? "" : "s"}`;
          break;
        case "pkg-search": packageQuery = value; packageRegion = "All"; navigate("/packages"); break;
        case "auth": authDialog(); break;
        case "signup": authDialog(true); break;
        case "profile": profileDialog(); break;
        case "signout": state.user = null; persist(); closeDialog(); renderHeader(); toast("Signed out. Shared demo trips remain on this browser."); break;
        case "go-trips": closeDialog(); navigate("/trips"); break;
        case "wishlist": closeDialog(); filters = { ...freshFilters(), saved: true }; state.search.destination = ""; persist(); navigate("/hotels"); break;
        case "favorite": {
          const saved = state.favorites.includes(id);
          state.favorites = saved ? state.favorites.filter(x => x !== id) : [...state.favorites, id];
          persist();
          if (route() === "/hotels" && filters.saved) updateHotelResults();
          else {
            button.setAttribute("aria-pressed", String(!saved));
            const stay = stays.find(s => s.id === id);
            button.setAttribute("aria-label", `${saved ? "Save" : "Remove"} ${stay.name} ${saved ? "to" : "from"} favorites`);
          }
          toast(saved ? "Removed from saved stays." : "A good find. Stay saved.");
          break;
        }
        case "destination": state.search.destination = destinations.find(d => d.id === id).name; filters = freshFilters(); persist(); navigate("/hotels"); break;
        case "collection": filters = { ...freshFilters(), collection: value }; state.search.destination = ""; persist(); navigate("/hotels"); break;
        case "category":
          destinationCategory = value;
          $$('[data-action="category"]').forEach(el => el.setAttribute("aria-pressed", String(el.dataset.value === value)));
          $("#destination-grid").innerHTML = destinationResults();
          $("#destination-count").textContent = `${filteredDestinations().length} destinations`;
          break;
        case "clear-filters": filters = freshFilters(); $("#hotel-filters").innerHTML = filterFields(); updateHotelResults(); break;
        case "reset-search": filters = freshFilters(); state.search.destination = ""; persist(); render(); break;
        case "toggle-filters": {
          const open = $("#hotel-filters").classList.toggle("is-open");
          button.setAttribute("aria-expanded", String(open));
          break;
        }
        case "gallery": {
          const stay = stays.find(s => s.id === id);
          const image = $(`#image-${id}`);
          const alternate = image.dataset.alternate !== "true";
          image.dataset.alternate = String(alternate);
          image.src = photo(alternate ? destinationFor(stay).image : stay.image, 800);
          image.alt = alternate ? `${destinationFor(stay).name} destination preview` : `${stay.name} accommodation preview`;
          break;
        }
        case "book": bookDialog(id); break;
        case "booking-back": bookDialog(bookingDraft.stayId, true); break;
        case "select-trip": selectedTrip = id; render(); break;
        case "modify": if (tripStatus(trip) === "Upcoming") modifyDialog(trip); break;
        case "cancel":
          openDialog("Cancel this reservation?", `<p>Your stay at <strong>${e(stays.find(s => s.id === trip.stayId).name)}</strong> will be marked as cancelled. This cannot be undone.</p><div class="notice">In a real booking, cancellation within 48 hours of check-in may incur the first night's room charge. This demo does not collect or refund money.</div><div class="row wrap"><button class="btn secondary" data-action="close">Keep my trip</button><button class="btn danger" data-action="confirm-cancel" data-id="${e(trip.id)}">Cancel reservation</button></div>`);
          break;
        case "confirm-cancel":
          if (tripStatus(trip) !== "Upcoming") break;
          trip.status = "cancelled"; persist(); closeDialog(); render(); toast("Reservation cancelled. No real payment was collected."); break;
        case "add-note": addNoteDialog(trip); break;
        case "delete-note": {
          const current = state.trips.find(t => t.id === selectedTrip);
          current.notes = current.notes.filter(n => n.id !== id); persist(); render(); toast("Activity removed."); break;
        }
        case "print":
          $$(".day").forEach(day => day.open = true);
          window.print(); break;
        case "host":
          openDialog("Contact your front desk", `<p class="muted">About reservation ${e(trip.id)}</p><form id="host-form"><label class="field">Your message<textarea name="message" required minlength="10" maxlength="2000" placeholder="Ask about arrival, accessibility, or your stay."></textarea></label><div class="notice">Demo inquiry only. This message is not delivered to a property.</div><button class="btn accent">Submit demo inquiry</button></form>`); break;
        case "social":
          openDialog("Find us online", `<p class="muted">Follow Alive Dreams Holidays for departures, destinations and travel ideas.</p><div class="panel"><a class="text-link" href="https://www.facebook.com/profile.php?id=100084877547673" target="_blank" rel="noopener">Facebook</a><br><a class="text-link" href="https://www.linkedin.com/company/alive-dreams-holidays-pvt-ltd/" target="_blank" rel="noopener">LinkedIn</a><br><a class="text-link" href="https://www.instagram.com/alivedreamsholidays" target="_blank" rel="noopener">Instagram</a></div>`); break;
      }
    });

    function handleFilter(element) {
      const key = element.dataset.filter;
      if (!key) return;
      if (["types", "amenities"].includes(key)) {
        filters[key] = element.checked ? [...new Set([...filters[key], element.value])] : filters[key].filter(v => v !== element.value);
      } else if (key === "saved") filters.saved = element.checked;
      else if (["min", "max", "stars", "rating"].includes(key)) {
        filters[key] = Number(element.value);
        if (filters.min > filters.max) {
          if (key === "min") filters.max = filters.min;
          else filters.min = filters.max;
          $("#price-min").value = filters.min;
          $("#price-max").value = filters.max;
        }
      } else filters[key] = element.value;
      updateHotelResults();
    }

    document.addEventListener("input", event => {
      const element = event.target;
      if (element.id === "destination-finder") {
        destinationQuery = element.value;
        $("#destination-grid").innerHTML = destinationResults();
        $("#destination-count").textContent = `${filteredDestinations().length} destinations`;
      }
      if (element.id === "package-finder") {
        packageQuery = element.value;
        $("#package-grid").innerHTML = packageResults();
        const n = filteredPackages().length;
        $("#package-count").textContent = `${n} package${n === 1 ? "" : "s"}`;
      }
      if (element.matches('input[type="range"][data-filter]')) handleFilter(element);

      const form = element.closest("form");
      if (form?.id === "stay-search") {
        const a = Number(form.elements.adults.value) || 0;
        const c = Number(form.elements.children.value) || 0;
        const r = Number(form.elements.rooms.value) || 0;
        $("#guest-summary").textContent = `${a + c} guests, ${r} room${r !== 1 ? "s" : ""}`;
      }
      if (form && ["stay-search", "modify-form"].includes(form.id) && element.name === "checkin" && element.value) {
        form.elements.checkout.min = addDays(element.value, 1);
        if (form.elements.checkout.value <= element.value) form.elements.checkout.value = addDays(element.value, 1);
      }
      if (form?.id === "modify-form") {
        const trip = state.trips.find(t => t.id === form.dataset.id);
        const s = { ...readSearch(form), destination: trip.search.destination };
        const error = searchError(s);
        $("#modify-error").textContent = error;
        if (!error) $("#modify-costs").innerHTML = costSummary(calculate(stays.find(stay => stay.id === trip.stayId), s, trip.room), s);
      }
    });

    document.addEventListener("change", event => {
      const element = event.target;
      if (element.dataset.filter && element.type !== "range") handleFilter(element);
      if (element.id === "currency") {
        state.currency = element.value; persist(); render();
        toast("Display currency updated. Indicative conversions only.");
      }
      if (element.id === "room-select") {
        bookingDraft.room = element.value;
        $("#booking-costs").innerHTML = costSummary(calculate(stays.find(s => s.id === bookingDraft.stayId), bookingDraft.search, bookingDraft.room), bookingDraft.search);
      }
    });

    document.addEventListener("submit", event => {
      const form = event.target;
      event.preventDefault();
      if (!form.reportValidity()) return;
      const data = Object.fromEntries(new FormData(form));
      switch (form.id) {
        case "stay-search": {
          const search = readSearch(form);
          const error = searchError(search);
          if (error) { toast(error); return; }
          state.search = search; persist(); navigate("/hotels"); break;
        }
        case "auth-form": {
          const name = (data.name || data.email.split("@")[0]).trim();
          if (!name) { toast("Enter a name containing more than spaces."); return; }
          state.user = { name, email: data.email.trim(), notifications: true };
          persist(); closeDialog(); renderHeader(); toast("Demo profile ready. No password was stored."); break;
        }
        case "profile-form":
          if (!data.name.trim()) { toast("Please enter your name."); return; }
          state.user = { name: data.name.trim(), email: data.email.trim(), notifications: data.notifications === "on" };
          persist(); closeDialog(); renderHeader(); toast("Profile preferences saved."); break;
        case "booking-form":
          if (!data.name.trim() || !/^[+()\d\s.-]{7,30}$/.test(data.phone) || data.phone.replace(/\D/g, "").length < 7) {
            toast("Enter a full name and a valid phone number with at least 7 digits."); return;
          }
          bookingDraft.room = data.room;
          bookingDraft.guest = { name: data.name.trim(), email: data.email.trim(), phone: data.phone.trim(), requests: data.requests.trim() };
          reviewBooking(); break;
        case "confirm-booking-form": {
          if (!bookingDraft) return;
          const error = searchError(bookingDraft.search);
          if (error) { toast(error); return; }
          const trip = { ...structuredClone(bookingDraft), id: "TRV-" + uid().replace(/-/g, "").slice(0, 8).toUpperCase(), status: "confirmed", notes: [] };
          state.trips.unshift(trip);
          selectedTrip = trip.id;
          persist();
          bookingDraft = null;
          closeDialog();
          navigate("/trips");
          openDialog("Reservation confirmed", `<div style="text-align:center"><span class="badge">${icon("check")} Demo reservation confirmed</span><h2 style="margin-top:22px">Your stay is held.</h2><p class="muted">Reference <strong>${e(trip.id)}</strong><br>Your itinerary is ready in My Trips.</p><div class="notice"><strong>Nothing charged today.</strong><br>Pay upon arrival / direct property settlement.<br>This is a local demo, not a real hotel reservation.</div><button class="btn accent" data-action="close">Explore my itinerary ${icon("arrow")}</button></div>`);
          break;
        }
        case "modify-form": {
          const trip = state.trips.find(t => t.id === form.dataset.id);
          if (tripStatus(trip) !== "Upcoming") { toast("Only upcoming reservations can be modified."); return; }
          const search = { ...readSearch(form), destination: trip.search.destination };
          const error = searchError(search);
          if (error) { $("#modify-error").textContent = error; return; }
          trip.search = search;
          trip.costs = calculate(stays.find(s => s.id === trip.stayId), search, trip.room);
          trip.notes = trip.notes.filter(n => Number(n.day) < nights(search));
          persist(); closeDialog(); render(); toast("Reservation updated. Your new estimate is ready."); break;
        }
        case "note-form": {
          if (!data.text.trim()) { toast("Add an activity or note first."); return; }
          const trip = state.trips.find(t => t.id === form.dataset.id);
          trip.notes.push({ id: uid(), day: Number(data.day), slot: data.slot, text: data.text.trim() });
          persist(); closeDialog(); render(); toast("A little more to look forward to. Activity added."); break;
        }
        case "contact-form": {
          if (!data.name.trim() || data.message.trim().length < 10) { toast("Enter your name and a message of at least 10 characters."); return; }
          const msg = `New enquiry from ${data.name.trim()}\nPhone: ${data.phone}\nEmail: ${data.email || "—"}\nTopic: ${data.subject}\n\n${data.message.trim()}`;
          form.reset();
          closeDialog();
          openWhatsApp(msg);
          toast("Opening WhatsApp with your message. Press send and we'll get back to you.");
          break;
        }
        case "callback-form": {
          if (!data.name.trim() || data.phone.replace(/\D/g, "").length < 10) { toast("Enter your name and a phone number with at least 10 digits."); return; }
          const msg = `Callback request from ${data.name.trim()}\nPhone: ${data.phone}\nDestination / package: ${data.destination}\nTravel date: ${data.date || "flexible"}\nTravellers: ${data.pax}`;
          closeDialog();
          openWhatsApp(msg);
          toast("Opening WhatsApp with your callback request. Press send and we'll call you back.");
          break;
        }
        case "host-form":
          if (data.message.trim().length < 10) { toast("Write a message of at least 10 characters."); return; }
          closeDialog(); toast("Demo inquiry validated. No message was sent to the property."); break;
        case "newsletter-form":
          form.reset(); toast("Demo signup validated. No subscription or email was created."); break;
      }
    });

    // The skip link focuses the main landmark without changing the app route.
    $(".skip").addEventListener("click", event => {
      event.preventDefault();
      $("#main-content").focus();
      $("#main-content").scrollIntoView();
    });

    window.addEventListener("hashchange", () => {
      if (modal.open) closeDialog();
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
      $("#main-content").focus({ preventScroll: true });
    });

    // Broken remote images receive a local, dependency-free placeholder.
    document.addEventListener("error", event => {
      if (!(event.target instanceof HTMLImageElement) || event.target.dataset.fallback) return;
      event.target.dataset.fallback = "true";
      event.target.src = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="#e3e9df"/><circle cx="760" cy="180" r="80" fill="#d6be91"/><path d="M0 620 330 230 560 470 740 310 1000 620v80H0Z" fill="#719386"/><path d="m0 650 290-230 300 280H0Z" fill="#315e51"/><text x="50" y="85" fill="#153d39" font-family="sans-serif" font-size="34">Somewhere worth discovering.</text></svg>'
      );
    }, true);

    persist();
    render();
  </script>
</body>
</html>
